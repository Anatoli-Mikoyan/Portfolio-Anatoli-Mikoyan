[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "qbot"
version = "1.0.0"
description = "Trading algorithmique quantitatif : features causales, Rainbow distributionnel, backtest et validation anti-sur-apprentissage"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10"]

[project.optional-dependencies]
rl = ["torch>=2.0"]
ml = ["scikit-learn>=1.3"]
regime = ["scikit-learn>=1.3", "hmmlearn>=0.3"]
yaml = ["PyYAML>=6.0"]
dev = ["pytest>=7.4"]
all = ["torch>=2.0", "scikit-learn>=1.3", "hmmlearn>=0.3", "PyYAML>=6.0", "pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["qbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
