<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800"
     font-family="Inter, 'Segoe UI', sans-serif" role="img"
     aria-label="Schéma du laboratoire Hyper-V : un hôte Windows 11 Pro héberge un contrôleur de domaine Windows Server 2025 et un poste client Windows 11, reliés par un commutateur virtuel interne avec passerelle NAT vers Internet.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/><stop offset=".55" stop-color="#0d1526"/><stop offset="1" stop-color="#0a1a24"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="glowA" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity=".42"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#06b6d4" stop-opacity=".34"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity=".22"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6f8ab5"/>
    </marker>
    <clipPath id="rounded"><rect x="0" y="0" width="1280" height="800" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="1280" height="800" fill="url(#bg)"/>
    <ellipse cx="200" cy="80" rx="440" ry="300" fill="url(#glowA)"/>
    <ellipse cx="1120" cy="620" rx="400" ry="300" fill="url(#glowB)"/>
    <ellipse cx="700" cy="420" rx="420" ry="260" fill="url(#glowC)"/>

    <!-- ===================================================== EN-TÊTE -->
    <rect x="44" y="38" width="30" height="30" rx="9" fill="url(#brand)"/>
    <path d="M52 53 h14 M59 46 v14" stroke="#0b1120" stroke-width="2.6" stroke-linecap="round"/>
    <text x="88" y="54" fill="#e8eeff" font-size="21" font-weight="700" letter-spacing="-.3">Labo Hyper-V — infrastructure Windows</text>
    <text x="88" y="76" fill="#94a3c4" font-size="13.5">Réseau virtuel isolé · domaine Active Directory · déploiement scripté en PowerShell</text>

    <rect x="1020" y="36" width="216" height="34" rx="10" fill="#f59e0b" fill-opacity=".13" stroke="#f59e0b" stroke-opacity=".45"/>
    <circle cx="1040" cy="53" r="4.5" fill="#f59e0b"/>
    <text x="1054" y="58" fill="#f3c178" font-size="12.5" font-weight="600">Maquette personnelle · 2026</text>

    <!-- ============================================= HÔTE HYPER-V -->
    <rect x="44" y="108" width="880" height="508" rx="18" fill="#ffffff" fill-opacity=".028"
          stroke="#3b82f6" stroke-opacity=".32" stroke-dasharray="7 6"/>
    <rect x="68" y="92" width="268" height="32" rx="9" fill="#0d1526" stroke="#3b82f6" stroke-opacity=".45"/>
    <text x="86" y="113" fill="#8ab4f8" font-size="13" font-weight="600">Hôte Hyper-V — Windows 11 Pro</text>

    <!-- ======================================== VM : contrôleur de domaine -->
    <rect x="92" y="156" width="372" height="236" rx="16" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".12"/>
    <rect x="92" y="156" width="372" height="4" rx="2" fill="url(#brand)"/>

    <rect x="116" y="182" width="40" height="40" rx="11" fill="#3b82f6" fill-opacity=".16"/>
    <rect x="127" y="193" width="18" height="13" rx="2" stroke="#8ab4f8" stroke-width="1.8" fill="none"/>
    <path d="M127 210 h18 M131 214 h10" stroke="#8ab4f8" stroke-width="1.8" stroke-linecap="round"/>
    <text x="170" y="198" fill="#e8eeff" font-size="15.5" font-weight="700">Windows Server 2025</text>
    <text x="170" y="217" fill="#94a3c4" font-size="12.5">Contrôleur de domaine · SRV-LAB01</text>

    <line x1="116" y1="242" x2="440" y2="242" stroke="#ffffff" stroke-opacity=".09"/>

    <g font-size="12.5">
      <circle cx="122" cy="266" r="3.5" fill="#34d399"/>
      <text x="136" y="270" fill="#c3cde6">Active Directory Domain Services</text>
      <circle cx="122" cy="292" r="3.5" fill="#34d399"/>
      <text x="136" y="296" fill="#c3cde6">DNS — zone <tspan fill="#8ab4f8">lab.local</tspan></text>
      <circle cx="122" cy="318" r="3.5" fill="#34d399"/>
      <text x="136" y="322" fill="#c3cde6">DHCP — étendue 192.168.10.100-150</text>
      <circle cx="122" cy="344" r="3.5" fill="#34d399"/>
      <text x="136" y="348" fill="#c3cde6">Unités d'organisation, groupes, GPO</text>
    </g>

    <rect x="116" y="362" width="150" height="22" rx="6" fill="#3b82f6" fill-opacity=".14"/>
    <text x="128" y="377" fill="#8ab4f8" font-size="11.5" font-family="ui-monospace, monospace">192.168.10.10 /24</text>

    <!-- ======================================== VM : poste client -->
    <rect x="504" y="156" width="372" height="236" rx="16" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".12"/>
    <rect x="504" y="156" width="372" height="4" rx="2" fill="#06b6d4"/>

    <rect x="528" y="182" width="40" height="40" rx="11" fill="#06b6d4" fill-opacity=".16"/>
    <rect x="538" y="192" width="20" height="14" rx="2" stroke="#5ee0f0" stroke-width="1.8" fill="none"/>
    <path d="M543 212 h10 M548 206 v6" stroke="#5ee0f0" stroke-width="1.8" stroke-linecap="round"/>
    <text x="582" y="198" fill="#e8eeff" font-size="15.5" font-weight="700">Windows 11</text>
    <text x="582" y="217" fill="#94a3c4" font-size="12.5">Poste utilisateur · PC-LAB01</text>

    <line x1="528" y1="242" x2="852" y2="242" stroke="#ffffff" stroke-opacity=".09"/>

    <g font-size="12.5">
      <circle cx="534" cy="266" r="3.5" fill="#5ee0f0"/>
      <text x="548" y="270" fill="#c3cde6">Joint au domaine, ouverture de session AD</text>
      <circle cx="534" cy="292" r="3.5" fill="#5ee0f0"/>
      <text x="548" y="296" fill="#c3cde6">Application et vérification des GPO</text>
      <circle cx="534" cy="318" r="3.5" fill="#5ee0f0"/>
      <text x="548" y="322" fill="#c3cde6">Lecteur réseau mappé, partage de fichiers</text>
      <circle cx="534" cy="344" r="3.5" fill="#5ee0f0"/>
      <text x="548" y="348" fill="#c3cde6">Tests : ping, nslookup, gpresult</text>
    </g>

    <rect x="528" y="362" width="150" height="22" rx="6" fill="#06b6d4" fill-opacity=".14"/>
    <text x="540" y="377" fill="#5ee0f0" font-size="11.5" font-family="ui-monospace, monospace">192.168.10.20 /24</text>

    <!-- ======================================== liaisons vers le switch -->
    <path d="M278 392 V 446" stroke="#6f8ab5" stroke-width="1.8" stroke-opacity=".8"/>
    <path d="M690 392 V 446" stroke="#6f8ab5" stroke-width="1.8" stroke-opacity=".8"/>
    <circle cx="278" cy="392" r="4" fill="#3b82f6"/>
    <circle cx="690" cy="392" r="4" fill="#06b6d4"/>

    <!-- ======================================== commutateur virtuel -->
    <rect x="92" y="446" width="784" height="68" rx="14" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".14"/>
    <rect x="116" y="464" width="32" height="32" rx="9" fill="#ffffff" fill-opacity=".08"/>
    <path d="M124 480 h16 M128 474 v12 M136 474 v12" stroke="#c3cde6" stroke-width="1.8" stroke-linecap="round"/>
    <text x="164" y="476" fill="#e8eeff" font-size="14.5" font-weight="700">Commutateur virtuel interne — LAB-Switch</text>
    <text x="164" y="496" fill="#94a3c4" font-size="12.5">Réseau isolé de la machine hôte · aucun accès entrant depuis le réseau domestique</text>

    <rect x="700" y="462" width="152" height="36" rx="9" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".4"/>
    <circle cx="720" cy="480" r="4.5" fill="#34d399"/>
    <text x="734" y="485" fill="#6ee7b7" font-size="12" font-weight="600">Isolé &amp; réversible</text>

    <!-- ======================================== passerelle NAT -->
    <path d="M484 514 V 556" stroke="#6f8ab5" stroke-width="1.8" stroke-opacity=".8" marker-end="url(#arrow)"/>
    <rect x="336" y="556" width="296" height="48" rx="12" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".12"/>
    <text x="360" y="578" fill="#e8eeff" font-size="13.5" font-weight="600">Passerelle NAT</text>
    <text x="360" y="595" fill="#94a3c4" font-size="12">Sortie Internet pour les mises à jour</text>
    <rect x="496" y="566" width="118" height="24" rx="6" fill="#ffffff" fill-opacity=".07"/>
    <text x="508" y="583" fill="#c3cde6" font-size="11.5" font-family="ui-monospace, monospace">192.168.10.1</text>

    <!-- ===================================================== COLONNE DROITE -->

    <!-- création des VM en PowerShell -->
    <rect x="952" y="108" width="284" height="214" rx="16" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".11"/>
    <rect x="976" y="130" width="32" height="32" rx="9" fill="#3b82f6" fill-opacity=".16"/>
    <path d="M983 140 l7 6 -7 6 M995 152 h8" stroke="#8ab4f8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1020" y="152" fill="#e8eeff" font-size="14" font-weight="700">Déploiement scripté</text>

    <rect x="976" y="178" width="236" height="118" rx="10" fill="#060b16" stroke="#ffffff" stroke-opacity=".08"/>
    <g font-family="ui-monospace, monospace" font-size="10.5">
      <text x="992" y="200" fill="#6f8ab5">PS&gt;</text>
      <text x="1016" y="200" fill="#8ab4f8">New-VM</text>
      <text x="1062" y="200" fill="#c3cde6">-Name SRV-LAB01</text>
      <text x="992" y="219" fill="#c3cde6">-MemoryStartupBytes 4GB</text>
      <text x="992" y="238" fill="#c3cde6">-SwitchName LAB-Switch</text>
      <text x="992" y="262" fill="#6f8ab5">PS&gt;</text>
      <text x="1016" y="262" fill="#8ab4f8">Checkpoint-VM</text>
      <text x="1096" y="262" fill="#c3cde6">-Name ...</text>
      <text x="992" y="281" fill="#5ee0f0">✓ point de contrôle créé</text>
    </g>

    <!-- méthode -->
    <rect x="952" y="342" width="284" height="274" rx="16" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".11"/>
    <rect x="976" y="364" width="32" height="32" rx="9" fill="#f59e0b" fill-opacity=".16"/>
    <path d="M984 380 l5 5 9-10" stroke="#f3c178" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1020" y="386" fill="#e8eeff" font-size="14" font-weight="700">Méthode</text>

    <g font-size="12.5">
      <rect x="976" y="414" width="236" height="1" fill="#ffffff" fill-opacity=".08"/>
      <circle cx="982" cy="440" r="3.5" fill="#f3c178"/>
      <text x="996" y="444" fill="#c3cde6">Point de contrôle avant chaque</text>
      <text x="996" y="461" fill="#c3cde6">manipulation sensible</text>
      <circle cx="982" cy="489" r="3.5" fill="#f3c178"/>
      <text x="996" y="493" fill="#c3cde6">Adressage fixe, pas de DHCP</text>
      <text x="996" y="510" fill="#c3cde6">parasite sur le réseau hôte</text>
      <circle cx="982" cy="538" r="3.5" fill="#f3c178"/>
      <text x="996" y="542" fill="#c3cde6">Vérification systématique :</text>
      <text x="996" y="559" fill="#c3cde6">connectivité puis résolution DNS</text>
      <circle cx="982" cy="587" r="3.5" fill="#f3c178"/>
      <text x="996" y="591" fill="#c3cde6">Chaque étape consignée dans</text>
      <text x="996" y="608" fill="#c3cde6">une procédure réutilisable</text>
    </g>

    <!-- ===================================================== BANDEAU BAS -->
    <rect x="44" y="648" width="1192" height="104" rx="16" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".1"/>
    <text x="72" y="682" fill="#94a3c4" font-size="11.5" letter-spacing=".16em" font-weight="600">CE QUE LE LABO PERMET DE REPRODUIRE</text>
    <g font-size="12.5">
      <rect x="72" y="700" width="268" height="30" rx="8" fill="#3b82f6" fill-opacity=".1"/>
      <text x="88" y="720" fill="#c3cde6">Création et déverrouillage de comptes</text>

      <rect x="356" y="700" width="268" height="30" rx="8" fill="#06b6d4" fill-opacity=".1"/>
      <text x="372" y="720" fill="#c3cde6">Jonction au domaine, GPO, lecteurs</text>

      <rect x="640" y="700" width="268" height="30" rx="8" fill="#f59e0b" fill-opacity=".1"/>
      <text x="656" y="720" fill="#c3cde6">Pannes DNS / DHCP et diagnostic</text>

      <rect x="924" y="700" width="288" height="30" rx="8" fill="#34d399" fill-opacity=".1"/>
      <text x="940" y="720" fill="#c3cde6">Restauration après incident</text>
    </g>

    <rect x="0.5" y="0.5" width="1279" height="799" rx="20" fill="none" stroke="#ffffff" stroke-opacity=".1"/>
  </g>
</svg>
